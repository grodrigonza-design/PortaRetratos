name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # La llave de firma vive en los secretos del repositorio, nunca en el código.
      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/firma.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/firma.keystore" >> "$GITHUB_ENV"
            echo "TAREA=assembleRelease" >> "$GITHUB_ENV"
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin el secreto SIGNING_KEYSTORE_B64: se compila una versión de prueba (no sirve para actualizar encima)."
            echo "TAREA=assembleDebug" >> "$GITHUB_ENV"
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle "$TAREA" --no-daemon --stacktrace

      - name: Preparar archivos
        run: |
          mkdir -p salida
          cp "$APK" salida/PortaRetratos.apk
          cp -r tarjeta-sd/Portarretratos salida/
          rm -f salida/Portarretratos/fotos/.gitkeep
          (cd salida && zip -qr ../PortaRetratos-tarjeta-sd.zip Portarretratos)

      - uses: actions/upload-artifact@v4
        with:
          name: PortaRetratos
          path: |
            salida/PortaRetratos.apk
            PortaRetratos-tarjeta-sd.zip

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v') && env.TAREA == 'assembleRelease'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" salida/PortaRetratos.apk PortaRetratos-tarjeta-sd.zip \
            --title "PortaRetratos $GITHUB_REF_NAME" \
            --notes "Descargue **PortaRetratos.apk** e instálelo en la tablet. Instrucciones en el README."

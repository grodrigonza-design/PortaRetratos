plugins {
    id 'com.android.application'
}

android {
    namespace 'cr.portarretratos'
    compileSdk 34

    defaultConfig {
        applicationId 'cr.portarretratos'
        minSdk 19          // Android 4.4 (la tablet Digiland DL701Q)
        //noinspection ExpiredTargetSdkVersion: la app es solo para esa tablet; así no pide permisos en tiempo de ejecución
        targetSdk 22
        versionCode 1
        versionName '1.0.0'
    }

    // Firma: la llave NO está en el repositorio. GitHub Actions la toma de los secretos
    // SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD (ver README). Siempre la misma llave =
    // cada versión nueva se instala encima de la anterior sin perder nada.
    def llave = System.getenv('SIGNING_KEYSTORE')
    signingConfigs {
        publica {
            if (llave) {
                storeFile file(llave)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias System.getenv('SIGNING_ALIAS') ?: 'portarretratos'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (llave) signingConfig signingConfigs.publica
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Los marcos y el fechas.txt de la carpeta tarjeta-sd van también dentro de la app,
    // para que funcione sin tarjeta SD (todo se maneja desde el teléfono).
    sourceSets {
        main {
            assets.srcDirs += ['../tarjeta-sd']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
